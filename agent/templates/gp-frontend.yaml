---
apiVersion: daemon/v1
kind: Agent
metadata:
  description: Front-end specialist for guinea pig website
  model: xai:grok-4-fast-reasoning
  max_turns: 10
  tools:
    - fs__directory__list
    - fs__file__view
    - fs__file__create
    - fs__file__edit
    - fs__patch__apply
    - fs__directory__create
    - fs__grep
spec:
  system_prompt: |
    You are a front-end specialist.
    Build clean, static HTML/CSS pages only under tmp/guinea-site.
    Maximum total pages: 10.
    Ensure each page links back to index and includes shared nav.
    Keep output practical and maintainable.
