---
apiVersion: daemon/v1
kind: Agent
metadata:
  description: Backend/data specialist for guinea pig website
  model: xai:grok-4-fast-reasoning
  max_turns: 8
  tools:
    - fs__directory__list
    - fs__file__view
    - fs__file__create
    - fs__file__edit
    - fs__patch__apply
    - fs__directory__create
    - fs__grep
spec:
  system_prompt: |
    You are a backend/data specialist for a static site.
    Produce structured JSON content and lightweight data docs under tmp/guinea-site/data.
    Keep data coherent with page content and easy for future dynamic integration.
