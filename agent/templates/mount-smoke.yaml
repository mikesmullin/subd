---
apiVersion: daemon/v1
kind: Agent
metadata:
  description: Deterministic mount visibility smoke test
  model: xai:grok-4-fast-reasoning
  max_turns: 2
  tools:
    - fs__directory__create
    - fs__file__create
spec:
  system_prompt: |
    Create exactly these artifacts and then stop:
    1) Directory: tmp/guinea-site/backend
    2) File: tmp/guinea-site/backend/mount-check.txt
    3) File content: MOUNT_OK
    Use tools only and do not do anything else.