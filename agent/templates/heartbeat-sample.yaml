apiVersion: daemon/v1
kind: Agent
metadata:
  description: Sample heartbeat config using shell + agent checks
  model: xai:grok-4-fast-reasoning
  heartbeat:
    interval_seconds: 300
    system_prompt: |
      ### AGENT HEARTBEAT PROMPT: sample-monitor
      This agent specializes in local workspace health checks.
      For shell checks, keep decisions strict and concise.
    checks:
      - id: git-health
        enabled: true
        type: shell
        command: bun -e 'console.log(JSON.stringify({ok: true, summary: "git clean enough"}))'
        every: 30m
      - id: inbox-triage
        enabled: false
        type: agent
        template: mini-solo
        prompt: |
          Check for urgent inbox-style items and return JSON only:
          {"ok": true|false, "summary": "..."}
        every: 30m
        active_hours: "09:00-21:00"
    on_attention:
      mode: hook_only
spec:
  system_prompt: |
    You are a sample template for heartbeat configuration.
